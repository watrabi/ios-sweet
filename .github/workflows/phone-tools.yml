name: phone-tools

# Userland for the running phone (iOS 16 arm64, signed ad hoc): dropbear (SSH), dash, toybox, and
# ios-flame's tools (lsreg, oslog, psx, openapp, imgtest, ...). Install: tools/bonito-install-ssh.sh.

on:
  workflow_dispatch:
  push:
    branches: [bonito]
    paths:
      - "userland/tools/**"
      - ".github/workflows/phone-tools.yml"

concurrency:
  group: phone-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DROPBEAR_TAG: DROPBEAR_2024.86
      DASH_VER: 0.5.12
      TOYBOX_TAG: 0.8.11
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          brew install gnu-sed autoconf automake || true
          mkdir -p work/userland/bin work/stage work/stub/sys
          cat > work/userland/bin/ios-cc <<'EOF'
          #!/bin/sh
          exec "$(xcrun -f clang)" -arch arm64 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -miphoneos-version-min=16.0 "$@"
          EOF
          chmod +x work/userland/bin/ios-cc
          # toybox's macOS port includes <sys/disk.h> (not in the iOS SDK): the two ioctls it uses
          cat > work/stub/sys/disk.h <<'EOF'
          #include <sys/ioctl.h>
          #include <stdint.h>
          #define DKIOCGETBLOCKSIZE  _IOR('d', 24, uint32_t)
          #define DKIOCGETBLOCKCOUNT _IOR('d', 25, uint64_t)
          EOF
          echo "IOSCC=$PWD/work/userland/bin/ios-cc" >> "$GITHUB_ENV"

      - name: dropbear
        run: |
          set -e
          git clone -q --depth 1 -b "$DROPBEAR_TAG" https://github.com/mkj/dropbear.git work/dropbear
          cd work/dropbear
          cat > localoptions.h <<'EOF'
          /* bonito: one root user, public keys only; no multi-user setuid dance */
          #define DROPBEAR_SVR_MULTIUSER 0
          #define DROPBEAR_SVR_PASSWORD_AUTH 0
          #define DROPBEAR_SVR_PAM_AUTH 0
          #define DROPBEAR_X11FWD 0
          #define DEFAULT_PATH "/var/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          #define DSS_PRIV_FILENAME "/private/etc/dropbear/dropbear_dss_host_key"
          #define RSA_PRIV_FILENAME "/private/etc/dropbear/dropbear_rsa_host_key"
          #define ECDSA_PRIV_FILENAME "/private/etc/dropbear/dropbear_ecdsa_host_key"
          #define ED25519_PRIV_FILENAME "/private/etc/dropbear/dropbear_ed25519_host_key"
          EOF
          # single root user on a multi-user kernel: drop the sanity check that refuses that (ios-flame did the same)
          grep -rl "requires a non-multiuser kernel" src . 2>/dev/null | sort -u | while read f; do
            sed -i '' 's/dropbear_exit("Non-multiuser Dropbear requires a non-multiuser kernel");/(void)0;/' "$f"; done
          ! grep -rq 'dropbear_exit("Non-multiuser' src . 2>/dev/null
          CC="$IOSCC" ./configure --host=aarch64-apple-darwin --disable-zlib --disable-syslog --disable-lastlog \
            --disable-utmp --disable-utmpx --disable-wtmp --disable-wtmpx --disable-loginfunc \
            --disable-pututline --disable-pututxline --disable-harden > ../dropbear-configure.log 2>&1 ||
            { tail -40 ../dropbear-configure.log; exit 1; }
          make -j4 PROGRAMS="dropbear dropbearkey scp dbclient" MULTI=1 > ../dropbear-make.log 2>&1 ||
            { grep -E "error" -A3 ../dropbear-make.log | head -60; exit 1; }
          cp dropbearmulti ../stage/

      - name: dash
        run: |
          set -e
          cd work
          curl -sfL "https://git.kernel.org/pub/scm/utils/dash/dash.git/snapshot/dash-$DASH_VER.tar.gz" | tar xz
          cd "dash-$DASH_VER"
          ./autogen.sh > /dev/null 2>&1
          ac_cv_func_strchrnul=no CC="$IOSCC" CFLAGS="-std=gnu99 -Os -Wno-implicit-function-declaration" ./configure --host=aarch64-apple-darwin > ../dash-configure.log 2>&1 ||
            { tail -40 ../dash-configure.log; exit 1; }
          make -j4 CC_FOR_BUILD=clang > ../dash-make.log 2>&1 || { grep -E "error" -A3 ../dash-make.log | head -60; exit 1; }
          cp src/dash ../stage/

      - name: toybox
        run: |
          set -e
          git clone -q --depth 1 -b "$TOYBOX_TAG" https://github.com/landley/toybox.git work/toybox
          cd work/toybox
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          make macos_defconfig > /dev/null
          make -j4 HOSTCC=clang CC="$IOSCC" CFLAGS="-I$PWD/../stub -Os" > ../toybox-make.log 2>&1 ||
            { grep -E "error" -A3 ../toybox-make.log | head -60; exit 1; }
          cp toybox ../stage/

      - name: flame tools
        run: |
          set -e
          (cd userland/tools && ./build.sh)
          cp userland/tools/out/* work/stage/

      - name: Sign and check
        run: |
          cd work/stage
          for f in dropbearmulti dash toybox; do codesign -f -s - "$f"; done
          for f in *; do echo "== $f"; nm -m "$f" 2>/dev/null | grep "weak external" | grep -v "dynamically looked up" | head -5 || true; done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: phone-tools
          path: work/stage/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phone-tools-logs
          path: work/*.log
          if-no-files-found: ignore
